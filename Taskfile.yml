version: "3"

dotenv: ['.env']

vars:
  PYTHON: "uv run python"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  run:
    desc: Run the main application
    cmds:
      - uv run streamlit run main.py

  install:
    desc: Install dependencies using uv
    cmds:
      - uv sync

  test:
    desc: Run tests
    cmds:
      - uv run python -m unittest discover -s tests -v

  baseline-sachs:
    desc: Run the Sachs unconstrained PC/GES/LiNGAM baseline
    cmds:
      - uv run python -m experiments.baseline_sachs

  reactome-coverage:
    desc: Probe Reactome coverage for the Sachs nodes and write the JSON report
    cmds:
      - uv run python -m experiments.reactome_coverage

  ground-sachs:
    desc: Run batched LLM grounding for Sachs columns and write experiments/grounding_sachs.json
    cmds:
      - uv run python -m experiments.run_grounding_sachs

  floor-sachs:
    desc: Build OmniPath C0.5 floor priors for Sachs (both source filters)
    cmds:
      - uv run python -m experiments.run_floor_sachs

  reasoning-smoke-sachs:
    desc: Step 4 Phase 2 prompt-lock smoke test (5 textbook Sachs pairs)
    cmds:
      - uv run python -m experiments.run_reasoning_smoke

  lint:
    desc: Run ruff checks
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .
