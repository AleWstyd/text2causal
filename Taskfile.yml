version: "3"

dotenv: ['.env']

vars:
  PYTHON: "uv run python"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  run:
    desc: Run the main application
    cmds:
      - uv run streamlit run main.py

  install:
    desc: Install dependencies using uv
    cmds:
      - uv sync

  test:
    desc: Run tests
    cmds:
      - uv run python -m unittest discover -s tests -v

  reason-with-fallback-sachs:
    desc: Alias for fallback-priors (two-stage merge for Sachs + DREAM4 PSN + LiverDREAM)
    cmds:
      - uv run python -m experiments.run_reasoning_with_fallback

  fallback-priors:
    desc: Two-stage merge — paragraph freetext_priors_*.json (if present) then per_pair_freetext_priors_*.json (if present) → causal_priors_*_with_fallback.json
    cmds:
      - uv run python -m experiments.run_reasoning_with_fallback

  per-pair-freetext-fallback:
    desc: Per-pair LLM priors for Reactome no-context pairs (Sachs + DREAM4 PSN + LiverDREAM; uses cache/llm)
    cmds:
      - uv run python -m experiments.run_per_pair_freetext_fallback

  baseline-sachs:
    desc: Run the Sachs unconstrained PC/GES/LiNGAM baseline
    cmds:
      - uv run python -m experiments.baseline_sachs

  reactome-coverage:
    desc: Probe Reactome coverage for the Sachs nodes and write the JSON report
    cmds:
      - uv run python -m experiments.reactome_coverage

  ground-sachs:
    desc: Run batched LLM grounding for Sachs columns and write experiments/grounding_sachs.json
    cmds:
      - uv run python -m experiments.run_grounding_sachs

  floor-sachs:
    desc: Build OmniPath C0.5 floor priors for Sachs (both source filters)
    cmds:
      - uv run python -m experiments.run_floor_sachs

  reasoning-smoke-sachs:
    desc: Step 4 Phase 2 prompt-lock smoke test (5 textbook Sachs pairs)
    cmds:
      - uv run python -m experiments.run_reasoning_smoke

  reason-sachs:
    desc: Step 4 Phase 3 full LLM sweep over 110 ordered Sachs pairs
    cmds:
      - uv run python -m experiments.run_reasoning_sachs

  dag-llm-only-sachs:
    desc: Step 4 Phase 4 cycle-broken LLM-only DAG for Sachs
    cmds:
      - uv run python -m experiments.run_dag_llm_only_sachs

  oracle-priors-sachs:
    desc: Step 6 Phase 1 — ground-truth oracle prior claims for Sachs
    cmds:
      - uv run python -m experiments.run_oracle_priors_sachs

  freetext-sachs:
    desc: Step 6 Phase 1 — C1 free-text LLM priors for Sachs (cached LLM)
    cmds:
      - uv run python -m experiments.run_freetext_sachs

  lint:
    desc: Run ruff checks
    cmds:
      - uv run ruff check .

  discover-sachs:
    desc: Step 5 sweep — Sachs ablation across C0, C0.5 (×2), reactome_llm (4 thresholds), C5
    cmds:
      - uv run python -m experiments.run_discovery_sachs

  ablation-sachs:
    desc: Step 6 canonical ablation sweep on Sachs (210 algorithmic + 1 C-LLM-only)
    cmds:
      - uv run python -m experiments.runner

  constraint-quality-sachs:
    desc: Step 6 constraint quality evaluation (precision/recall/hallucination/coverage per priors source)
    cmds:
      - uv run python -m experiments.constraint_quality

  report-sachs:
    desc: Step 6 reporting - tables, figures, headline summary on Sachs
    cmds:
      - uv run python -m experiments.report

  cost-report:
    desc: Aggregate LLM cache costs and tokens; writes experiments/cost_report.json
    cmds:
      - uv run python -m experiments.cost_report

  lingam-sweep-sachs:
    desc: Step 6.5 A1 — Sachs LiNGAM sparse-prior sweep
    cmds:
      - uv run python -m experiments.lingam_sweep_sachs

  diagnose-pc-sachs:
    desc: Step 6.5 A2 — diagnose PC invariance and write AUPR snippet
    cmds:
      - uv run python -m experiments.diagnose_pc_invariance

  per-edge-attribution-sachs:
    desc: Step 6.7 — per-edge attribution for Sachs reaction-evidence true edges
    cmds:
      - uv run python -m experiments.per_edge_attribution_sachs

  dream4-psn:
    desc: Step 7 — DREAM4 PSN fallback synthetic dataset + ablation/report artefacts
    cmds:
      - uv run python -m experiments.run_synthetic_dream4_psn

  liverdream:
    desc: Step 7' — real public LiverDREAM / CellNOpt second-dataset pipeline
    cmds:
      - uv run python -m experiments.run_liverdream_real

  multi-llm-agreement:
    desc: Robustness — compare Reactome-context priors across LLM models
    cmds:
      - uv run python -m experiments.multi_llm_agreement

  adversarial-sachs:
    desc: Robustness — adversarial Sachs Reactome-context sanity test
    cmds:
      - uv run python -m experiments.adversarial_sanity_sachs

  paper:
    desc: Compile paper/main.tex when LaTeX is available; otherwise validate paper inputs
    cmds:
      - uv run python -m experiments.build_paper

  ablation:
    desc: Step 6 full ablation pipeline (sweep, constraint quality, report, cost report)
    cmds:
      - uv run python -m experiments.runner
      - uv run python -m experiments.constraint_quality
      - uv run python -m experiments.cost_report
      - uv run python -m experiments.report

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .
